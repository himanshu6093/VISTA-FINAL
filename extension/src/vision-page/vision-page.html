<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VISTA Vision Host (Firefox fallback)</title>
<!--
  Firefox has no chrome.offscreen API, so the vision pipeline runs here in a
  hidden extension tab. Same modules as Chromium, same importmap targets —
  only the relative prefix differs (../offscreen/vendor/...).
  This page is never shown (opened active:false); it hosts canvas/ORT/WASM
  exactly like the offscreen document does.
-->
<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "../offscreen/vendor/ort/ort.bundle.min.mjs",
    "onnxruntime-web/webgpu": "../offscreen/vendor/ort/ort.webgpu.bundle.min.mjs",
    "onnxruntime-common": "../offscreen/vendor/ort-common/index.js",
    "ppu-paddle-ocr/web": "../offscreen/vendor/paddle/web/index.js",
    "ppu-ocv/canvas-web": "../offscreen/vendor/ppu-ocv/index.canvas-web.js",
    "jsqr": "../offscreen/vendor/jsqr/jsqr.mjs",
    "@huggingface/transformers": "../offscreen/vendor/transformers/transformers.web.min.js"
  }
}
</script>
</head>
<body>
<script type="module" src="./vision-page.js"></script>
</body>
</html>
